[project]
name = "trader"
version = "0.1.0"
description = "Systematic daily swing trader for NIFTY 500 via Dhan"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "yfinance>=1.8.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
trader = "trader.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
