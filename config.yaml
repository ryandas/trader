mode: paper              # paper only; "live" is a deferred future option and is not implemented
capital: 25000          # starting capital (INR)
monthly_contribution: 5000   # INR deposited at each month-end close (0 = lump sum only)
risk_per_trade: 0.01     # fraction of equity risked per trade
history_years: 10

universe:
  min_bars: 250
  min_price: 50
  min_median_value_cr: 10   # 20-day median traded value, crore INR
  top_n: 50
  loose_top_n: 150          # mean reversion universe

momentum:                   # rotation strategy (trader momentum)
  lookback: 126
  skip: 21
  top_n: 10
  buffer: 10
  bear_exit: true

regime:
  bear_policy: mean_reversion_only   # or: none
  bear_size_mult: 0.5
  min_stat_trades: 20

risk:
  max_position_pct: 0.20
  max_positions: 10
  max_per_sector: 3
  max_heat: 0.06

costs:                      # delivery equity; see CostCfg for statutory defaults
  brokerage_per_order: 0    # check your Dhan plan
  slippage_bps: 5

# Shared paper account (PROVISIONAL, see AGENTS.md "Shared account"): no setting here. Every active sleeve (momentum,
# swing if present, each promoted candidate) gets an equal budget of account equity / N at the open; unused budget
# stays cash and is not reassigned. (The old `account.max_sleeve_share` cap was removed: the budget replaces it.)

research:                   # fixed gates for harness v4 (review if capital/contribution changes)
  dsr_min: 0.95
  max_annual_charges_pct: 3.0
  max_correlation: 0.9
  min_fold_win_share: 0.6666666666666666  # 2/3 of OOS years must beat index
